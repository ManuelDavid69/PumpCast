# Entraînement du modèle une fois par semaine. Les modèles sont gardés comme
# artefact GitHub (16 Mo), récupérés chaque jour par le workflow des prévisions.
name: Entraînement du modèle

on:
  schedule:
    # Le lundi à 3 h UTC, quand personne ne regarde le site
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ml
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: pumpcast
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Données externes à jour (Brent, EUR/USD, calendrier)
        run: python -m pumpcast_ml.sync_external
      - name: Entraînement et évaluation
        run: python -m pumpcast_ml.train --sample 300000
      - name: Prévisions avec le nouveau modèle
        run: python -m pumpcast_ml.predict
      - name: Garder les modèles
        uses: actions/upload-artifact@v5
        with:
          name: models
          # latest.txt dit quelle version utiliser
          path: ml/models/
          retention-days: 30
