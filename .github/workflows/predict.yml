# Prévisions du jour, puis alertes "baisse prévue" et "hausse prévue".
name: Prévisions du jour

on:
  schedule:
    # 5 h 30 UTC : après l'ingestion de 5 h 07, avant que les gens partent travailler
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Pour lire les artefacts du workflow d'entraînement
  actions: read

concurrency:
  group: ml
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: pumpcast
      REDIS_URL: ${{ secrets.REDIS_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Dernier entraînement réussi
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow train.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$id" ]; then
            echo "Aucun entraînement réussi : lancer d'abord le workflow Entraînement du modèle" >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          name: models
          path: ml/models
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ml
      - name: Données externes à jour
        run: python -m pumpcast_ml.sync_external
        working-directory: ml
      - name: Prévisions
        run: python -m pumpcast_ml.predict
        working-directory: ml

      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Alertes de baisse et de hausse prévues
        run: go run ./cmd/alerts
        working-directory: api
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EMAIL_PROVIDER: brevo
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL }}
