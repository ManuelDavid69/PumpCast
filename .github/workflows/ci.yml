# Tests et build à chaque push et à chaque pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API Go
    runs-on: ubuntu-latest
    # Les tests d'intégration ont besoin d'un vrai MongoDB et d'un vrai Redis
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Formatage (gofmt)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Code généré à jour (gqlgen)
        run: go tool gqlgen generate && git diff --exit-code -- graph
      - run: go vet ./...
      - name: Tests
        # En cas d'échec, les tests en erreur sont affichés comme annotations
        # GitHub : on voit la cause sans ouvrir les logs
        run: |
          set -o pipefail
          if ! go test -count=1 ./... 2>&1 | tee test.log; then
            grep -E -- "--- FAIL|_test\.go:[0-9]+|panic:" test.log | head -20 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
        env:
          MONGO_TEST_URI: mongodb://localhost:27017
          REDIS_TEST_URL: redis://localhost:6379/15
      - name: Image Docker
        run: docker build -t pumpcast-api .

  ml:
    name: Machine learning Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  web:
    name: Front Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Le build ne doit pas dépendre de l'API : aucune page n'est
          # pré-rendue avec des données
          NEXT_PUBLIC_GRAPHQL_URL: http://localhost:8080/graphql
