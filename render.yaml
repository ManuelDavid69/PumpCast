# Blueprint Render : décrit le service de l'API pour qu'il soit créé tout seul
# à partir du dépôt (New > Blueprint dans Render).
services:
  - type: web
    name: pumpcast-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # À remplir dans Render (jamais dans le code)
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      # Adresse du front sur Vercel, par exemple https://pumpcast.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Render génère un secret aléatoire à la création
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_DB
        value: pumpcast
      # Render est un proxy : l'IP du visiteur est la dernière de X-Forwarded-For
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_PLAYGROUND
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
