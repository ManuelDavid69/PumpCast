# Blueprint Render : décrit le service de l'API pour qu'il soit créé tout seul
# à partir du dépôt (New > Blueprint dans Render).
services:
  - type: web
    name: pumpcast
    # Runtime Go natif de Render : plus rapide à construire que l'image Docker
    # (le Dockerfile sert pour docker compose en local)
    runtime: go
    plan: free
    region: frankfurt
    rootDir: api
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./cmd/server
    startCommand: ./app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # À remplir dans Render (jamais dans le code)
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      # Adresse du front sur Vercel, par exemple https://pump-cast.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Render génère un secret aléatoire à la création
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_DB
        value: pumpcast
      # Render est un proxy : l'IP du visiteur est la dernière de X-Forwarded-For
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_PLAYGROUND
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
